[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-agent"
version = "0.1.0"
description = "A Bilibili video analysis agent with timestamped notes and Q&A."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "bilibili-api-python>=17.2.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0.3"]
vision = ["av>=12.0.0", "pytesseract>=0.3.13"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
bili-agent = "bili_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
